name: DevTrack CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devtrack_test
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Apply Migrations
        env:
          DATABASE_URL: postgresql://devtrack:devtrack_password@localhost:5432/devtrack_test
        run: |
          cd backend
          alembic upgrade head

      - name: Execute Tests
        env:
          DATABASE_URL: postgresql://devtrack:devtrack_password@localhost:5432/devtrack_test
          SECRET_KEY: devtrack-ci-testing-key-secret
        run: |
          pytest backend/tests -v
